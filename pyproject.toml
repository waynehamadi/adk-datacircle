[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-datacircle"
version = "0.1.0"
description = "Agent Development Kit (ADK) tools for the Datacircle API: find the best GTM APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["google-adk>=1.2.1", "requests>=2.25"]
keywords = ["google-adk", "adk", "agent-development-kit", "toolset", "agents", "tools", "gemini", "gtm", "api", "api-pricing", "b2b-data", "datacircle"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries",
]

[project.urls]
Homepage = "https://datacircle.dev"
Documentation = "https://api.datacircle.dev/v1/openapi.json"
Repository = "https://github.com/waynehamadi/adk-datacircle"

[dependency-groups]
test = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_datacircle"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE", "pyproject.toml"]
